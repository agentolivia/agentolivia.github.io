name: Update theme

# Manual only: run it from the Actions tab when you want to upgrade.
# It updates the theme and the pinned tool versions in versions.env together,
# builds the site with exactly those versions, and opens a PR to review.
on:
  workflow_dispatch:
    inputs:
      hugo_version:
        description: "Hugo version: 'latest', 'pinned' (keep current), or a number like 0.161.1"
        required: true
        default: latest
      dart_sass_version:
        description: "Dart Sass version: 'latest', 'pinned' (keep current), or a number like 1.97.1"
        required: true
        default: latest

jobs:
  update-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Resolve tool versions and update versions.env
        env:
          GH_TOKEN: ${{ github.token }}
          HUGO_INPUT: ${{ inputs.hugo_version }}
          SASS_INPUT: ${{ inputs.dart_sass_version }}
        run: |
          set -euo pipefail
          . ./versions.env

          resolve() { # resolve <input> <pinned> <repo>
            case "$1" in
              pinned) echo "$2" ;;
              latest) gh release view --repo "$3" --json tagName --jq '.tagName' | sed 's/^v//' ;;
              *) echo "$1" ;;
            esac
          }
          NEW_HUGO=$(resolve "${HUGO_INPUT}" "${HUGO_VERSION}" gohugoio/hugo)
          NEW_SASS=$(resolve "${SASS_INPUT}" "${DART_SASS_VERSION}" sass/dart-sass)

          for v in "${NEW_HUGO}" "${NEW_SASS}"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version: $v"; exit 1; }
          done

          sed -i -E "s/^HUGO_VERSION=.*/HUGO_VERSION=${NEW_HUGO}/; s/^DART_SASS_VERSION=.*/DART_SASS_VERSION=${NEW_SASS}/" versions.env
          grep -q "^HUGO_VERSION=${NEW_HUGO}$" versions.env && grep -q "^DART_SASS_VERSION=${NEW_SASS}$" versions.env \
            || { echo "::error::Failed to update versions.env"; exit 1; }

          grep -E '^[A-Z_]+=' versions.env >> "${GITHUB_ENV}"
          echo "Hugo ${HUGO_VERSION} -> ${NEW_HUGO}, Dart Sass ${DART_SASS_VERSION} -> ${NEW_SASS}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # hugo-theme-stack v4 compiles SCSS with Dart Sass
      - name: Install Dart Sass
        run: |
          mkdir -p "${HOME}/.local"
          curl -fsSLo "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Setup Hugo
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSLo "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLo "hugo_checksums.txt" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_checksums.txt"
          tar -C "${HOME}/.local/bin" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" "hugo_checksums.txt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Update theme
        run: hugo mod get -u

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      # Builds with the same versions production will use after merge
      - name: Build site
        run: hugo --gc --minify

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: 'CI: Update theme and tool versions'
          title: 'CI: Update theme and tool versions'
          body: |
            Manual update run. Changes:
            - Theme: `hugo mod get -u` (see `go.mod` / `go.sum`)
            - Hugo: ${{ env.HUGO_VERSION }}, Dart Sass: ${{ env.DART_SASS_VERSION }} (see `versions.env`)

            `versions.env` is read by the deploy workflow and Tugboat, so production and previews both use these versions. Check the Tugboat preview before merging.
          branch: automated/update-theme
          delete-branch: true
          add-paths: |
            go.mod
            go.sum
            versions.env
