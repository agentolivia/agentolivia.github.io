services:
  apache:
    image: tugboatqa/httpd

    urls:
      - /

    commands:
      init:
        # Tool versions come from versions.env at the repo root (shared with
        # the GitHub workflows). Each command runs in its own shell, so each
        # one loads the file itself.

        # Install Go and verify
        - . "${TUGBOAT_ROOT}/versions.env" && curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xzf - && /usr/local/go/bin/go version

        # Install Dart Sass (required by hugo-theme-stack v4) and verify
        - . "${TUGBOAT_ROOT}/versions.env" && curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -C /usr/local -xzf - && /usr/local/dart-sass/sass --version

        # Install Hugo Extended, verify its checksum, and print the version
        - . "${TUGBOAT_ROOT}/versions.env" && cd /tmp && curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" && curl -fsSLo hugo_checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" && sha256sum --check --ignore-missing hugo_checksums.txt && tar -C /usr/local/bin -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo && rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo_checksums.txt && hugo version

      build:
        # Build the site (export PATH and build in one command)
        - export PATH=$PATH:/usr/local/go/bin:/usr/local/dart-sass && cd "${TUGBOAT_ROOT}" && hugo --gc --minify

        # Link the generated public directory to Apache's document root
        - ln -snf "${TUGBOAT_ROOT}/public" "${DOCROOT}"
